<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificar caixa</title>
</head>
<body>
    <header class="cabeçalho">
        <div class="data">
            <p>01/01/2026</p>
        </div>
    </header>

    <section class="menu">
        <div class="titulo">
            <h1>CAIXA</h1>
        </div>
        <div class="abas">
            <label>MENU</label>
            <div class="inicio">
                <label>Início</label>
            </div>
            <div class="notas">
                <label>Notas</label>
            </div>
            <div class="relatorio">
                <label>Relatório</label>
            </div>
        </div>
    </section>
    
    <main class="container">
        <div class="title">
            <div class="texto">
                <h1>Verificação de Caixa</h1>
                <p>Insira os arquivos corretamente para conferir os valores do dia.</p>
            </div>
            <div class="data">
                <p>01/01/2026</p>
            </div>
        </div>
        <div class="valores">
            <div class="sistema">
                <label>Valores Sistema</label>
                <div class="stm-dinheiro">
                    <label>Dinheiro</label>
                    <p>R$ 0,00</p>
                </div>
                <div class="stm-pix">
                    <label>Pix</label>
                    <p>R$ 0,00</p>
                </div>
                <div class="stm-credito">
                    <label>Crédito</label>
                    <p>R$ 0,00</p>
                </div>
                <div class="stm-debito">
                    <label>Débito</label>
                    <p>R$ 0,00</p>
                </div>
            </div>
            <div class="maquina">
                <label>Valores Máquina</label>
                <div class="mqn-pix">
                    <label>Pix</label>
                    <p>R$ 0,00</p>
                </div>
                <div class="mqn-credito">
                    <label>Crédito</label>
                    <p>R$ 0,00</p>
                </div>
                <div class="mqn-debito">
                    <label>Débito</label>
                    <p>R$ 0,00</p>
                </div>
            </div>
        </div>
        <div class="fechamentos">
            <label>Fechamentos</label>
            <div class="dados">
                <div class="fmt-caixa-anterior">
                    <label>Caixa anterior</label>
                    <p>R$ 0,00</p>
                </div>
                <div class="fmt-caixa-esperado">
                    <label>Caixa esperado</label>
                    <p>R$ 0,00</p>
                </div>
                <div class="fmt-caixa-atual">
                    <label>Caixa atual</label>
                    <p>R$ 0,00</p>
                </div>
                <div class="fmt-dinheiro">
                    <label>Dinheiro</label>
                    <p>R$ 0,00</p>
                </div>
            </div>
            <div class="resultados">
                <div class="rtd-valor-final">
                    <label>Valor final</label>
                    <p>R$ 0,00</p>
                </div>
                <div class="rtd-vendas-liquidas">
                    <label>Vendas liquidas</label>
                    <p>R$ 0,00</p>
                </div>
            </div>
        </div>
        <div class="botoes">
            <div class="btn-ajuste">
                <button>Ajustar</button>
            </div>
            <div class="btn-fechar">
                <button>Fechar</button>
            </div>
            <div class="btn-voltar">
                <button>Voltar</button>
            </div>
        </div>
    </main>

</body>
</html>
